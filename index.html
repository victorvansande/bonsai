<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bonsai-almanak</title>
<meta name="theme-color" content="#ECEBE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151B" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bonsai">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <main id="view" class="scroll"></main>
  <nav id="tabs" class="tabs" aria-label="Schermen" hidden>
    <button class="tab" data-action="tab" data-tab="vandaag"><span class="jp" lang="ja" aria-hidden="true">今</span>Vandaag<i class="tab-dot" id="tab-dot" hidden></i></button>
    <button class="tab" data-action="tab" data-tab="kalender"><span class="jp" lang="ja" aria-hidden="true">暦</span>Kalender</button>
    <button class="tab" data-action="tab" data-tab="hulp"><span class="jp" lang="ja" aria-hidden="true">診</span>Hulp</button>
    <button class="tab" data-action="tab" data-tab="logboek"><span class="jp" lang="ja" aria-hidden="true">記</span>Logboek</button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<div class="test-badge" id="test-badge" hidden>TEST</div>
<input type="file" accept="image/*" id="camera" hidden>
<noscript><p style="padding:24px;font-family:sans-serif">Deze app heeft JavaScript nodig.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
